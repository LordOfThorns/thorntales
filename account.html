<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title data-i18n="nav.account">Кабинет · Thorntales</title>
  <link rel="stylesheet" href="/assets/style.css?v=50" />
</head>
<body data-page="account">
  <main class="wrap">
    <header class="top">
      <h1 data-i18n="account.title">Кабинет</h1>
      <p class="sub" id="accountSub" data-i18n="account.loading">Загрузка…</p>
    </header>

    <div class="account" id="account" hidden>
      <section class="panel form">
        <h2 class="panel__title" data-i18n="account.profile">Профиль</h2>

        <div class="avatar-edit">
          <div class="avatar-edit__preview" id="avatarPreview"></div>
          <div class="avatar-edit__actions">
            <label class="btn">
              <span data-i18n="account.uploadAvatar">Загрузить аватарку</span>
              <input type="file" id="avatarInput" accept="image/jpeg,image/png,image/webp" hidden>
            </label>
            <button class="btn btn--ghost" type="button" id="avatarRemove" data-i18n="account.removeAvatar">Убрать</button>
            <p class="field__hint" data-i18n="account.avatarHint">JPG, PNG или WebP. Картинка обрежется в квадрат.</p>
          </div>
        </div>

        <form id="nameForm" novalidate>
          <label class="field">
            <span class="field__label" data-i18n="account.nameLabel">Имя, которое видят другие</span>
            <input class="input" name="name" maxlength="40" required>
          </label>
          <p class="form__msg" id="profileMsg" role="status"></p>
          <button class="btn btn--primary" type="submit" data-i18n="account.save">Сохранить</button>
        </form>
      </section>

      <section class="panel form">
        <h2 class="panel__title" data-i18n="account.password">Пароль</h2>
        <form id="passForm" novalidate>
          <label class="field">
            <span class="field__label" data-i18n="account.newPass">Новый пароль</span>
            <input class="input" type="password" name="pass" autocomplete="new-password" minlength="8" required>
          </label>
          <label class="field">
            <span class="field__label" data-i18n="account.repeatPass">Ещё раз</span>
            <input class="input" type="password" name="pass2" autocomplete="new-password" minlength="8" required>
          </label>
          <p class="form__msg" id="passMsg" role="status"></p>
          <button class="btn" type="submit" data-i18n="account.changePass">Сменить пароль</button>
        </form>
      </section>

      <button class="btn btn--ghost" type="button" id="logout" data-i18n="account.logout">Выйти</button>
    </div>

    <footer class="bottom">
      <small>© 2026</small>
    </footer>
  </main>

  <script src="/assets/i18n.js?v=14"></script>
  <script src="/assets/layout.js?v=3"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="/assets/auth.js"></script>
  <script src="/assets/account.js"></script>
</body>
</html>
