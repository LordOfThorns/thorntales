<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
<!-- Old paper: fine fibres and uneven, mottled ageing; brown, semi-transparent,
     laid over the paper colour of the poetry collection cards. Seamless. -->
<filter id="f" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency=".9 .55" numOctaves="2" seed="4" stitchTiles="stitch" result="fine"/>
  <feColorMatrix in="fine" values="0 0 0 0 .32  0 0 0 0 .25  0 0 0 0 .16  0 0 0 .55 -.22" result="fibres"/>
  <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="4" seed="8" stitchTiles="stitch" result="big"/>
  <feColorMatrix in="big" values="0 0 0 0 .42  0 0 0 0 .32  0 0 0 0 .18  0 0 0 .8 -.42" result="mottle"/>
  <feMerge><feMergeNode in="mottle"/><feMergeNode in="fibres"/></feMerge>
</filter>
<rect width="240" height="240" filter="url(#f)"/>
</svg>
