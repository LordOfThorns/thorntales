<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title data-i18n="nav.admin">Админка · Thorntales</title>

<body data-page="admin">
  <main class="wrap">
    <header class="top">
      <h1 data-i18n="admin.title">Админка</h1>
      <p class="sub" id="adminSub" data-i18n="account.loading">Загрузка…</p>

    <div class="admin" id="adminPage" hidden>
      <section class="panel">
        <h2 class="panel__title" data-i18n="admin.backupTitle">Полный бэкап</h2>

        <pre class="admin__log" id="backupLog" aria-live="polite"></pre>

        <a class="btn btn--ghost" href="/tags.html" data-i18n="admin.tagsLink">Открыть теги</a>
      </section>

      <section class="panel">
        <h2 class="panel__title" data-i18n="admin.reviewersTitle">Ревьюеры</h2>
        <p class="admin__text" data-i18n="admin.reviewersText"></p>
        <div class="admin-users" id="reviewers"></div>
      </section>
    </div>

    <footer class="bottom">
      <small>© 2026</small>
    </footer>
